# Alternative adapter: a generic FT2232D JTAG/UART dongle (the one that
# ships with the Sipeed LicheeTang) driving the Malahit over SWD.
#
# WHY BOTHER, WHEN THE ST-LINK WORKS
#
# It works for everything except reset. NRST is wired from J2 pin 1 to the
# adapter and the lead reads through, but an assert/deassert cycle leaves
# the target's VTOR untouched - it never sees a reset. From the host that
# has two indistinguishable explanations: a dead reset pin on the dongle,
# or an OpenOCD backend that does not drive reset at all. This board needs
# the dapdirect_swd backend, because hla_swd cannot talk to this part, and
# reset support is not the same between the two.
#
# On an FTDI, reset is not a feature of the adapter's firmware - it is a
# GPIO that OpenOCD toggles itself. ADBUS5 goes straight to the header.
# There is nothing in between to be broken or unimplemented.
#
# Try tools/srst-test.sh with a meter first. If the ST-LINK turns out to
# drive reset properly, none of this is needed.
#
# ---------------------------------------------------------------------
# WHAT THIS ADAPTER ACTUALLY BOUGHT, AND WHAT IT DID NOT
#
# It drives NRST, demonstrably: with ADBUS5 forced low the radio's DFU
# device vanishes from the USB bus and returns when it is released, and
# an "adapter assert srst" pulse now takes the debug port down exactly
# as a real reset should. The ST-LINK could never be shown to do either.
#
# What that does NOT buy, while the firmware runs from RAM: anything
# useful. Reset puts the vector table back at 0x08000000, so control
# returns to the FACTORY firmware, which settles into a low-power state
# and takes the debug port with it. Every successful reset therefore
# ends in a radio that has to be power-cycled - the reset works, and
# that is precisely the problem.
#
# Reset becomes worth having at the point this project's own firmware
# lives in flash. Until then core_clean in openocd.cfg is the right
# tool, and crashes are recovered by src/fault.c returning from the
# handler rather than by resetting anything.
#
# ---------------------------------------------------------------------
# WIRING
#
# FT2232D is a JTAG adapter; SWD needs one bidirectional pin, so TDI and
# TDO are joined to make it. The series resistor is what lets the target
# win when both ends drive at once - without it, TDI fights the target's
# SWDIO on every read and one of them eventually loses for good.
#
#   dongle P1                                       Malahit J2
#   ---------                                       ----------
#   1  ADBUS0  TCK   ---------------------------->  2  SWCLK
#   9  ADBUS1  TDI   ---[ 470R ]---+
#   3  ADBUS2  TDO   --------------+------------->  4  SWDIO
#   7  ADBUS5  SRST  ---------------------------->  1  NRST
#   2  GND           ---------------------------->  3  GND
#
#   P1 pin 10 is 3V3 OUT from the dongle. LEAVE IT UNCONNECTED - the
#   radio powers itself from its own battery or USB, and tying two
#   supplies together is a good way to find out which one is stronger.
#
#   470R is not critical; 330R to 1k all work. Keep the TDO leg short,
#   it is the one that has to see clean edges.
#
# ---------------------------------------------------------------------
# UNTESTED. Written from the dongle's schematic (ADBUS0..3 = TCK/TDI/
# TDO/TMS, ADBUS5 = SRST, confirmed against the FT2232D pin numbers 24,
# 23, 22, 21 and 19) rather than from a working session. Expect to adjust
# the layout masks if it does not come up first try.
#
# Note the D in FT2232D: MPSSE tops out around 6 MHz on this part, where
# an FT2232H would do 30. 1 MHz below is deliberately modest; raise it
# once it is known to work.

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0

# Direction and initial level for ADBUS, low byte.
#   bit 0 TCK  out
#   bit 1 TDI  out   (drives SWDIO through the resistor)
#   bit 2 TDO  in    (reads SWDIO)
#   bit 3 TMS  out   (unused in SWD, parked high)
#   bit 5 SRST out   (idle HIGH, so reset is released at startup)
#
# direction = 0b00101011 = 0x2b, initial value = 0b00101000 = 0x28
#
# THE INITIAL VALUE OF BIT 5 IS THE WHOLE POINT. 0x28 has it SET, so
# reset is released the moment the adapter initialises. An earlier
# version of this file used 0x08 here - bit 5 clear - and held the radio
# in reset through every single attempt: no USB, no DFU, and access
# points that could not be reached because the debug subsystem was in
# reset along with everything else. The DP still answered, so it read
# like marginal signal integrity rather than a config error.
#
# Driving reset low really does work, and that is how we know: with bit 5
# forced low the DFU device disappears from the USB bus and comes back
# when it is released. The wire from P1 pin 7 to J2 pin 1 is good.
ftdi layout_init 0x0028 0x002b

# SWD_EN exists only because the ftdi driver insists on it. There is no
# buffer to switch on this dongle, so it is a no-op.
ftdi layout_signal SWD_EN -data 0

# Reset, driven both ways.
#
# -oe on its own, which is how an open-drain signal is meant to be
# declared, did not work: "adapter assert srst" left the pin alone and
# the target never reset, while forcing the same bit low through
# layout_init plainly did reset it. Every stock OpenOCD ftdi config
# declares nSRST with -data, which is what the driver actually acts on -
# asserting reset drives the bit to 0.
#
# The cost is that reset is now driven high as well as low, and the MCU
# pulls the same pin low itself during an internal reset, so the two can
# briefly fight through R14 (10k). A 100-470 ohm resistor in the NRST
# lead removes that entirely and costs nothing; worth adding if this
# adapter becomes permanent.
ftdi layout_signal nSRST -data 0x0020 -oe 0x0020

transport select swd

source [find target/stm32h7x.cfg]

# NOT srst_nogate, despite how it reads. That option promises OpenOCD
# that reset leaves the debug port alone, so it keeps talking straight
# through the pulse - and on this part reset takes the debug port down
# with everything else. The result is "cannot read IDR" from the moment
# reset is released, forever, because nothing ever re-initialises the
# DP. Leaving it out is what makes OpenOCD do that re-initialisation.
reset_config srst_only srst_push_pull

# After the target file, so it is not overridden by it. Modest on purpose:
# SWDIO here is two FTDI pins joined through a resistor, which is not the
# cleanest signal path in the world. Raise it once things work.
adapter speed 1000

# NOT connect_assert_srst, however tempting. Measured on this part:
# holding NRST through the attach lets the DP answer - DPIDR reads fine -
# but every access point then fails with "cannot read IDR", because the
# reset takes the debug subsystem down with the rest of the chip. The
# first attempt with this adapter looked like broken wiring and was
# nothing of the sort.
#
# Worse, OpenOCD asserts reset at the start of init and does not release
# it if init then fails, so the radio is left held in reset: no USB, no
# DFU, and the next attempt sees a target that is not merely asleep but
# switched off. If that happens, run
#
#     openocd -f openocd-ft2232d.cfg -c "reset_config connect_deassert_srst" \
#             -c "init" -c "adapter deassert srst" -c "exit"
#
# to let go of it.
#
# "reset halt" still works and is still the point of this adapter; it is
# only attaching WITH reset held that this part dislikes.
reset_config connect_deassert_srst

# Same target helpers the ST-LINK config uses: core_clean, ram_run,
# fault, rail_on, backlight_on, whoami.
source [file dirname [file normalize [info script]]]/openocd-helpers.cfg
