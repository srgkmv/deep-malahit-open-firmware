# OpenOCD configuration for the Malahit DSP-1 (STM32H743VIT6).
#
# WHY dapdirect_swd AND NOT hla_swd.
#
# OpenOCD's stock interface/stlink.cfg selects the "high level adapter"
# transport. On this board an ST-LINK/V2 (firmware V2J37S7) fails there with
#
#     Info : Target voltage: 3.248469
#     Error: init mode failed (unable to connect to the target)
#
# even though the voltage reading proves the cable and the target rail are
# fine. Switching to interface/stlink-dap.cfg, which drives the debug access
# port directly instead of going through the ST-LINK's own protocol, connects
# on the first try:
#
#     Info : SWD DPIDR 0x6ba02477
#     Info : [stm32h7x.cpu0] Cortex-M7 r1p1 processor detected
#
# The same applies to the stlink-tools package: st-info and st-flash only
# speak HLA, so neither of them will ever see this chip. Use OpenOCD.
#
# Wiring is connector J2 on the board, and its pin order is NOT the usual
# one, so check it before blaming anything else:
#
#     J2.1 = NRST      J2.2 = SWCLK (PA14)
#     J2.3 = GND       J2.4 = SWDIO (PA13)
#
# There is no Vcc pin on J2. Power the radio from its own battery or USB.

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# 1.8 MHz connects reliably here. Drop to 480 kHz if the wiring is long or
# the connection is intermittent.
adapter speed 1800

source [find target/stm32h7x.cfg]

#
# RESET. Read this before trusting "reset halt".
#
# J2 pin 1 is NRST, but it is only useful if a wire actually runs from
# there to the adapter's reset pin. WITHOUT THAT WIRE "reset halt" DOES
# NOT RESET ANYTHING, and the way it fails is the expensive kind: with
# srst_only configured, OpenOCD drives a line that is not connected,
# reports success, and leaves the core exactly as it was.
#
# That cost an evening. An image was loaded over a core still sitting in
# an active SysTick exception from the previous run; it faulted on the
# first exception return, and every reload after that started from a
# worse state than the one before. The giveaway, had anyone looked, was
# VTOR still reading 0x24000000 after a "reset" - the previous image's
# vector table, which a real reset would have put back to 0x08000000.
#
# So: "none" is the honest setting for a board wired the way this one is.
# Nothing here pretends to reset. core_clean below does by hand what a
# reset would have done, which is enough to start an image over a crashed
# one, and ram_run calls it for you.
#
# IF YOU ADD THE NRST WIRE - one more lead from J2 pin 1 - change this to
#     reset_config srst_only srst_nogate
# and reset halt starts working properly. Worth doing; it is one wire.
#
# SYSRESETREQ is deliberately not used either: on this part a system reset
# takes the debug access port down with it, and OpenOCD then loses the
# target ("Fail reading CTRL/STAT register"). Measured, not assumed.
#
reset_config none separate

#
# Put the core back into a state an image can start from, without a reset.
#
# The order matters. Interrupts are silenced first, so nothing new can
# arrive while the rest is being unpicked; then the sticky fault status is
# cleared, so the next crash reports itself and not its predecessor; then
# the active-exception bits, which are what actually prevent a fresh
# image's first exception return from working.
#
proc core_clean {} {
    halt

    # SysTick off: control register and current value both.
    mww 0xE000E010 0
    mww 0xE000E018 0

    # Every NVIC interrupt disabled and un-pended. Eight registers of 32
    # covers all 150 interrupts on this part with room to spare.
    for {set i 0} {$i < 8} {incr i} {
        mww [expr {0xE000E180 + $i * 4}] 0xFFFFFFFF   ;# ICER: disable
        mww [expr {0xE000E280 + $i * 4}] 0xFFFFFFFF   ;# ICPR: clear pending
    }

    # Sticky fault status, write-one-to-clear.
    mww 0xE000ED28 0xFFFFFFFF   ;# CFSR
    mww 0xE000ED2C 0xFFFFFFFF   ;# HFSR

    # Active-exception bits in SHCSR. Clearing these while an exception is
    # genuinely active is outside what ARM defines, which is why it lives
    # in a recovery path and not in normal startup - but it is the only
    # way back from a crashed image when NRST is not wired.
    mmw 0xE000ED24 0 0x00000FFF

    echo "core cleaned: SysTick off, NVIC quiet, fault status cleared"
}

#
# Load an ELF into AXI SRAM and start it. No reset involved: the stack
# pointer and entry point are taken out of the image's own vector table at
# 0x24000000, and xPSR gets its Thumb bit set explicitly - without that
# last step the first instruction raises INVSTATE and the whole thing
# looks like a firmware bug.
#
proc ram_run {image} {
    core_clean
    load_image $image
    reg sp [mrw 0x24000000]
    reg pc [mrw 0x24000004]
    reg xPSR 0x01000000
    resume
    echo "running from RAM - flash untouched"
}

#
# Read the crash record that src/fault.h pins at 0x2407FF00. Survives a
# warm reset and a reload, so it can be read after recovering the part.
#
proc fault {} {
    halt
    if {[mrw 0x2407FF00] != 0x4D414C46} {
        echo "no crash recorded (magic absent at 0x2407FF00)"
        resume
        return
    }
    echo "--- crash record ---"
    echo [format "  ipsr       0x%08x" [mrw 0x2407FF04]]
    echo [format "  exc_return 0x%08x" [mrw 0x2407FF08]]
    echo [format "  pc         0x%08x   <- the faulting instruction" \
                 [mrw 0x2407FF24]]
    echo [format "  lr         0x%08x" [mrw 0x2407FF20]]
    echo [format "  xpsr       0x%08x" [mrw 0x2407FF28]]
    echo [format "  cfsr       0x%08x" [mrw 0x2407FF2C]]
    echo [format "  hfsr       0x%08x" [mrw 0x2407FF30]]
    echo [format "  count      %d" [mrw 0x2407FF3C]]
    resume
}

# ---------------------------------------------------------------------------
# Helpers. Call them from the OpenOCD console, or with -c from the shell.
# ---------------------------------------------------------------------------

# Turn on the switched 3.3V rail that feeds the display, touch panel, MSi001
# and codec. After reset that rail is OFF (R38 pulls the enable low), so
# nothing outside the MCU answers until PC6 goes high. See BOARD.md section 3.
proc rail_on {} {
    halt
    mmw 0x580244E0 0x00000006 0            ;# RCC_AHB4ENR: GPIOBEN | GPIOCEN
    mmw 0x58020800 0x00001000 0x00002000   ;# GPIOC MODER: PC6 -> output
    mww 0x58020818 0x00000040              ;# GPIOC BSRR:  PC6 = 1
    echo "3.3V peripheral rail ON (PC6 high)"
}

# Panel backlight on PB8, straight GPIO high (no PWM).
proc backlight_on {} {
    halt
    mmw 0x580244E0 0x00000002 0            ;# RCC_AHB4ENR: GPIOBEN
    mmw 0x58020400 0x00010000 0x00020000   ;# GPIOB MODER: PB8 -> output
    mww 0x58020418 0x00000100              ;# GPIOB BSRR:  PB8 = 1
    echo "backlight ON (PB8 high)"
}

proc backlight_off {} {
    halt
    mww 0x58020418 0x01000000              ;# GPIOB BSRR: PB8 reset
    echo "backlight OFF"
}

# Who are we talking to?
proc whoami {} {
    halt
    echo "--- DBGMCU_IDCODE (expect 0x20036450: dev 0x450, rev V) ---"
    mdw 0x5C001000 1
    echo "--- flash size in kB (expect 0x0800 = 2048) ---"
    mdh 0x1FF1E880 1
    echo "--- unique device ID ---"
    mdw 0x1FF1E800 3
    echo "--- reset vector at 0x08000000 ---"
    mdw 0x08000000 2
}
