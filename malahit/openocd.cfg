# OpenOCD configuration for the Malahit DSP-1 (STM32H743VIT6).
#
# WHY dapdirect_swd AND NOT hla_swd.
#
# OpenOCD's stock interface/stlink.cfg selects the "high level adapter"
# transport. On this board an ST-LINK/V2 (firmware V2J37S7) fails there with
#
#     Info : Target voltage: 3.248469
#     Error: init mode failed (unable to connect to the target)
#
# even though the voltage reading proves the cable and the target rail are
# fine. Switching to interface/stlink-dap.cfg, which drives the debug access
# port directly instead of going through the ST-LINK's own protocol, connects
# on the first try:
#
#     Info : SWD DPIDR 0x6ba02477
#     Info : [stm32h7x.cpu0] Cortex-M7 r1p1 processor detected
#
# The same applies to the stlink-tools package: st-info and st-flash only
# speak HLA, so neither of them will ever see this chip. Use OpenOCD.
#
# Wiring is connector J2 on the board, and its pin order is NOT the usual
# one, so check it before blaming anything else:
#
#     J2.1 = NRST      J2.2 = SWCLK (PA14)
#     J2.3 = GND       J2.4 = SWDIO (PA13)
#
# There is no Vcc pin on J2. Power the radio from its own battery or USB.

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# 1.8 MHz connects reliably here. Drop to 480 kHz if the wiring is long or
# the connection is intermittent.
adapter speed 1800

source [find target/stm32h7x.cfg]

# The board brings its own reset line out on J2.1. srst_nogate lets OpenOCD
# use it without also gating the debug clock, which the H7 does not like.
reset_config srst_only srst_nogate

# ---------------------------------------------------------------------------
# Helpers. Call them from the OpenOCD console, or with -c from the shell.
# ---------------------------------------------------------------------------

# Turn on the switched 3.3V rail that feeds the display, touch panel, MSi001
# and codec. After reset that rail is OFF (R38 pulls the enable low), so
# nothing outside the MCU answers until PC6 goes high. See BOARD.md section 3.
proc rail_on {} {
    halt
    mmw 0x580244E0 0x00000006 0            ;# RCC_AHB4ENR: GPIOBEN | GPIOCEN
    mmw 0x58020800 0x00001000 0x00002000   ;# GPIOC MODER: PC6 -> output
    mww 0x58020818 0x00000040              ;# GPIOC BSRR:  PC6 = 1
    echo "3.3V peripheral rail ON (PC6 high)"
}

# Panel backlight on PB8, straight GPIO high (no PWM).
proc backlight_on {} {
    halt
    mmw 0x580244E0 0x00000002 0            ;# RCC_AHB4ENR: GPIOBEN
    mmw 0x58020400 0x00010000 0x00020000   ;# GPIOB MODER: PB8 -> output
    mww 0x58020418 0x00000100              ;# GPIOB BSRR:  PB8 = 1
    echo "backlight ON (PB8 high)"
}

proc backlight_off {} {
    halt
    mww 0x58020418 0x01000000              ;# GPIOB BSRR: PB8 reset
    echo "backlight OFF"
}

# Who are we talking to?
proc whoami {} {
    halt
    echo "--- DBGMCU_IDCODE (expect 0x20036450: dev 0x450, rev V) ---"
    mdw 0x5C001000 1
    echo "--- flash size in kB (expect 0x0800 = 2048) ---"
    mdh 0x1FF1E880 1
    echo "--- unique device ID ---"
    mdw 0x1FF1E800 3
    echo "--- reset vector at 0x08000000 ---"
    mdw 0x08000000 2
}
