#
# Target helpers, shared by every adapter config in this directory.
#
# Nothing in here touches the adapter: these procs only read and write
# the STM32H743's own registers, so they are identical whether the cable
# is an ST-LINK or an FT2232D. They live in their own file because they
# were originally written inside the ST-LINK config, and the first time
# the FT2232D was used for a real job - running the panel bring-up - the
# loader simply was not there.
#
# Source this at the END of an adapter config, after the target file.
#

#
# Put the core back into a state an image can start from, without a reset.
#
# The order matters. Interrupts are silenced first, so nothing new can
# arrive while the rest is being unpicked; then the sticky fault status is
# cleared, so the next crash reports itself and not its predecessor; then
# the active-exception bits, which are what actually prevent a fresh
# image's first exception return from working.
#
proc core_clean {} {
    # INTERRUPTS OFF WHILE IT STILL RUNS, THEN HALT - not the other way
    # round. The image being replaced spends ~40 % of its time inside the
    # block interrupt (the AM demodulator), and a halt that lands there
    # leaves the new image running as that exception: nothing written
    # below can clear an NVIC active bit, and the block interrupt never
    # arrives again. Found 20/11/2026; startup_stm32h743.S step 0 has
    # the whole story and the firmware's own way out. This is the
    # loader's half: with SysTick and the NVIC off, a handler in progress
    # finishes and returns within its few milliseconds, and nothing new
    # starts - so a healthy image is halted in thread mode.
    mww 0xE000E010 0
    for {set i 0} {$i < 8} {incr i} {
        mww [expr {0xE000E180 + $i * 4}] 0xFFFFFFFF   ;# ICER: disable
    }
    sleep 20
    halt

    # SysTick off: control register and current value both.
    mww 0xE000E010 0
    mww 0xE000E018 0

    # AND NOTHING LEFT PENDING. Stopping SysTick does not un-pend a tick
    # already pending, and ICPR below covers external interrupts only.
    # A pending SysTick or PendSV is taken the instant the core leaves
    # halt - by resume, and by step too, since openocd's "auto" masking
    # lets pending interrupts run first - BEFORE the new image's first
    # instruction, through the new image's vector table, which the load
    # has already put in place. So its SysTick_Handler ran on memory
    # whose .data and .bss were still the OLD image's.
    #
    # Found 20/11/2026, and it switched the radio off: an image crashed
    # and parked in fault_park() with interrupts masked - SysTick
    # pending for good - and the next load's boot_power_tick() read the
    # old image's console text where its power-button statics now live:
    # "armed", "held" for ever, boot_standby(). Every load over a parked
    # crash did it, before printing a byte. Over a running image the
    # tick is serviced, so nothing is pending and nothing happens.
    #
    # ICSR: PENDSTCLR (bit 25) and PENDSVCLR (bit 27). NMI cannot be
    # un-pended from here; nothing in this firmware pends one.
    mww 0xE000ED04 0x0A000000

    # Every NVIC interrupt disabled and un-pended. Eight registers of 32
    # covers all 150 interrupts on this part with room to spare.
    for {set i 0} {$i < 8} {incr i} {
        mww [expr {0xE000E180 + $i * 4}] 0xFFFFFFFF   ;# ICER: disable
        mww [expr {0xE000E280 + $i * 4}] 0xFFFFFFFF   ;# ICPR: clear pending
    }

    # Sticky fault status, write-one-to-clear.
    mww 0xE000ED28 0xFFFFFFFF   ;# CFSR
    mww 0xE000ED2C 0xFFFFFFFF   ;# HFSR

    # Active-exception bits in SHCSR. Clearing these while an exception is
    # genuinely active is outside what ARM defines, which is why it lives
    # in a recovery path and not in normal startup - but it is the only
    # way back from a crashed image when NRST is not wired.
    mmw 0xE000ED24 0 0x00000FFF

    # THE DMA STOPS HERE TOO, BEFORE THE LOAD - halting the core does not
    # halt a DMA, and the image being replaced has SAI1 streaming 768 kB/s
    # into its receive ring. Without this it goes on through load_image
    # and into the new image's first milliseconds, until sai1_init()
    # clears SAIEN, writing samples into whatever the NEW layout put at
    # those addresses - code, .data, or .bss its startup just zeroed.
    #
    # Shown 20/11/2026, now that the image before every load is our own:
    # a SELFTEST=1 image loaded over a SELFTEST=0 one printed sai1.c's
    # s_mux_released - a mask of bits 0-15 - as 0x2c8df875 and then
    # 0xfe710720, two I/Q pairs; the old image's s_rx_ring spanned its
    # address. With this block, the same two loads twice more: 0x0000
    # both times. Whether the 05/11 DMA error count of 4 245 803 899
    # (main.c) was the same thing is NOT shown - it is 0xFD11D37B, also
    # a plausible pair, but it was seen to jump mid-run.
    #
    # Pulsed through RCC exactly as boot.c's quiesce() does before the
    # ROM bootloader: SAI1 first so the requests stop, then every DMA
    # controller. Peripheral resets, not a system reset: PC6, the rail
    # and the debug link are untouched, and the firmware sets all of
    # these up again from scratch.
    #
    # The addresses are &RCC->xRSTR as the CMSIS header computes them,
    # printed by a host program - NOT added up by hand. The first version
    # was added up by hand, landed 0x80 too high on the low-power ENABLE
    # registers (AHB1LPENR and friends), cleared the very clock bits it
    # meant to pulse, and reset nothing. It still printed "core cleaned";
    # reading DMA1's stream registers afterwards is what caught it.
    mmw 0x58024498 0x00400000 0   ;# RCC_APB2RSTR: SAI1RST
    mmw 0x58024498 0 0x00400000
    mmw 0x58024480 0x00000003 0   ;# RCC_AHB1RSTR: DMA1RST, DMA2RST
    mmw 0x58024480 0 0x00000003
    mmw 0x5802447C 0x00000001 0   ;# RCC_AHB3RSTR: MDMARST
    mmw 0x5802447C 0 0x00000001
    mmw 0x58024488 0x00200000 0   ;# RCC_AHB4RSTR: BDMARST
    mmw 0x58024488 0 0x00200000

    # CACHES OFF, BEFORE A SINGLE BYTE OF THE IMAGE IS WRITTEN.
    #
    # This is the half of the cache fix that only the loader can do.
    # load_image writes AXI SRAM through the AHB access port, which goes
    # around the CPU's caches and invalidates nothing - so the lines the
    # previous run left for those same addresses stay valid, and the core
    # then fetches the OLD program from the I-cache at addresses that now
    # hold the new one. The firmware cannot fix that by itself: by the
    # time its reset handler runs, the reset handler is the thing that
    # might have come from a stale line.
    #
    # The symptom is memorable. The first load after a power-on works,
    # because the factory firmware's cached lines cover flash and not
    # SRAM; the second load runs a mixture of two builds and fails
    # somewhere that makes no sense - correct arithmetic reporting no
    # answer, a hard fault whose PC and LR belong to different binaries.
    #
    # Clearing IC and DC in SCB_CCR stops the core using either. The
    # I-cache is then invalidated outright, which is one register write.
    # The D-cache is not: invalidating it needs a set/way loop, and with
    # DC clear its stale lines are never looked up and never written
    # back. Nothing here cleans either cache, deliberately - the dirty
    # lines describe the image being replaced, and writing them back is
    # exactly the corruption being prevented.
    mmw 0xE000ED14 0 0x00030000   ;# SCB_CCR: clear DC (bit 16), IC (bit 17)
    mww 0xE000EF50 0              ;# SCB_ICIALLU: whole I-cache invalid

    echo "core cleaned: SysTick off, NVIC quiet, faults cleared, SAI1 and DMA reset, caches off"
}

#
# Load an ELF into AXI SRAM and start it. No reset involved: the stack
# pointer and entry point are taken out of the image's own vector table at
# 0x24000000, and xPSR gets its Thumb bit set explicitly - without that
# last step the first instruction raises INVSTATE and the whole thing
# looks like a firmware bug.
#
proc ram_run {image} {
    core_clean
    load_image $image
    # CONTROL before the stack pointer, always. "reg sp" writes whichever
    # stack pointer CONTROL.SPSEL currently selects, so clearing CONTROL
    # afterwards would switch to an MSP nobody has set. Same trap as in
    # the startup code, same fix: decide which stack first, then load it.
    reg control 0
    reg faultmask 0
    reg primask 0
    reg basepri 0

    reg msp [mrw 0x24000000]
    reg pc [mrw 0x24000004]
    reg xPSR 0x01000000

    # A reset would clear these; starting an image by hand does not. The
    # firmware clears them too, in its first instructions, but doing it
    # here as well means a half-built image with no startup code of its
    # own still gets a sane machine. PRIMASK especially: a crashed run is
    # parked with interrupts off, and inheriting that means SysTick never
    # ticks and the next image hangs in its first delay loop.
    reg primask 0
    reg faultmask 0
    reg basepri 0
    reg control 0

    resume
    echo "running from RAM - flash untouched"
}

#
# Read the crash record that src/fault.h pins at 0x2407FF00. Survives a
# warm reset and a reload, so it can be read after recovering the part.
#
proc fault {} {
    halt
    if {[mrw 0x2407FF00] != 0x4D414C46} {
        echo "no crash recorded (magic absent at 0x2407FF00)"
        resume
        return
    }
    echo "--- crash record ---"
    echo [format "  ipsr       0x%08x" [mrw 0x2407FF04]]
    echo [format "  exc_return 0x%08x" [mrw 0x2407FF08]]
    echo [format "  pc         0x%08x   <- the faulting instruction" \
                 [mrw 0x2407FF24]]
    echo [format "  lr         0x%08x" [mrw 0x2407FF20]]
    echo [format "  xpsr       0x%08x" [mrw 0x2407FF28]]
    echo [format "  cfsr       0x%08x" [mrw 0x2407FF2C]]
    echo [format "  hfsr       0x%08x" [mrw 0x2407FF30]]
    echo [format "  count      %d" [mrw 0x2407FF3C]]
    resume
}

# ---------------------------------------------------------------------------
# Helpers. Call them from the OpenOCD console, or with -c from the shell.
# ---------------------------------------------------------------------------

# Turn on the switched 3.3V rail that feeds the display, touch panel, MSi001
# and codec. After reset that rail is OFF (R38 pulls the enable low), so
# nothing outside the MCU answers until PC6 goes high. See BOARD.md section 3.
proc rail_on {} {
    halt
    mmw 0x580244E0 0x00000006 0            ;# RCC_AHB4ENR: GPIOBEN | GPIOCEN
    mmw 0x58020800 0x00001000 0x00002000   ;# GPIOC MODER: PC6 -> output
    mww 0x58020818 0x00000040              ;# GPIOC BSRR:  PC6 = 1
    echo "3.3V peripheral rail ON (PC6 high)"
}

# Panel backlight on PB8, straight GPIO high (no PWM).
proc backlight_on {} {
    halt
    mmw 0x580244E0 0x00000002 0            ;# RCC_AHB4ENR: GPIOBEN
    mmw 0x58020400 0x00010000 0x00020000   ;# GPIOB MODER: PB8 -> output
    mww 0x58020418 0x00000100              ;# GPIOB BSRR:  PB8 = 1
    echo "backlight ON (PB8 high)"
}

proc backlight_off {} {
    halt
    mww 0x58020418 0x01000000              ;# GPIOB BSRR: PB8 reset
    echo "backlight OFF"
}

# Who are we talking to?
proc whoami {} {
    halt
    echo "--- DBGMCU_IDCODE (expect 0x20036450: dev 0x450, rev V) ---"
    mdw 0x5C001000 1
    echo "--- flash size in kB (expect 0x0800 = 2048) ---"
    mdh 0x1FF1E880 1
    echo "--- unique device ID ---"
    mdw 0x1FF1E800 3
    echo "--- reset vector at 0x08000000 ---"
    mdw 0x08000000 2
}
